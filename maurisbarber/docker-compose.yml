services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maurisbarber
      POSTGRES_PASSWORD: maurisbarber
      POSTGRES_DB: maurisbarber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maurisbarber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
